name: CI

# Before this existed, nothing ran lint, typecheck, or tests on any push or
# pull request — the only workflow in the repo was a manual-dispatch scraper
# run. Every check below was already available as an npm script and simply
# never invoked.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (lint · typecheck · unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --legacy-peer-deps

      # Full-repo gate: typecheck is clean, so any new error is a real
      # regression and should block.
      - name: Typecheck
        run: npm run typecheck

      # Advisory, not blocking. The repo carries ~147 pre-existing lint errors
      # (mostly react-hooks/set-state-in-effect and no-explicit-any) that need
      # real refactors, and they are spread across the same files active work
      # touches — so gating on them would leave CI permanently red and train
      # everyone to ignore it. Typecheck and tests above are the hard gates.
      #
      # TO MAKE THIS BLOCKING: clear the backlog (`npx eslint . --quiet` should
      # report zero), then delete this continue-on-error line. Until then the
      # annotation shows reviewers what a diff added.
      - name: Lint changed files (advisory)
        continue-on-error: true
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to diff against; skipping incremental lint."
            exit 0
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- 'frontend/**/*.ts' 'frontend/**/*.tsx' \
                    | sed 's|^frontend/||')
          if [ -z "$FILES" ]; then
            echo "No changed TypeScript files in frontend/."
            exit 0
          fi
          echo "$FILES"
          npx eslint $FILES

      - name: Unit tests
        run: npm test -- --run

  scraper:
    name: scraper (unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - run: npm ci
      - run: npm test

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A live Supabase service-role key was committed to this repo in two
      # .mjs scripts and went undetected. .gitignore cannot catch that — it
      # only covers .env files — so scan file contents on every push.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
